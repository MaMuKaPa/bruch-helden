 else{const c=42,r=39;h=`<svg class="pic" ${L} width="84" height="84" viewBox="0 0 84 84">`;if(b==1)h+=`<circle cx="${c}" cy="${c}" r="${r}" class="${a?'f':'e'}"/>`;else for(let i=0;i<b;i++){const t0=2*Math.PI*i/b-Math.PI/2,t1=2*Math.PI*(i+1)/b-Math.PI/2;h+=`<path d="M${c} ${c}L${c+r*Math.cos(t0)} ${c+r*Math.sin(t0)}A${r} ${r} 0 0 1 ${c+r*Math.cos(t1)} ${c+r*Math.sin(t1)}Z" class="${i<a?'f':'e'}"/>`}}
 return h+'</svg>'};
const RECT=(a,c,r)=>{let h=`<svg class="pic" role="img" aria-label="${a} von ${c*r} Feldern gefärbt" width="${c*28+4}" height="${r*28+4}" viewBox="0 0 ${c*28+4} ${r*28+4}">`;for(let i=0;i<c*r;i++)h+=`<rect x="${2+(i%c)*28}" y="${2+Math.floor(i/c)*28}" width="28" height="28" class="${i<a?'f':'e'}"/>`;return h+'</svg>'};
const MULTI=(a,b)=>Array.from({length:Math.ceil(a/b)},(_,i)=>PIC('pie',Math.min(b,a-i*b),b)).join('');
const NL=(a,b,s,m)=>{const x=v=>15+(v-a)*300/(b-a);let h=`<svg class="pic" role="img" aria-label="Zahlenstrahl von ${a} bis ${b}" width="330" height="62" viewBox="0 0 330 62"><line x1="10" y1="36" x2="320" y2="36"/>`;for(let v=a;v<=b;v+=s)h+=`<line x1="${x(v)}" y1="30" x2="${x(v)}" y2="42"/>`;[a,(a+b)/2,b].forEach(v=>h+=`<text x="${x(v)}" y="58">${v}</text>`);return h+`<polygon class="f" points="${x(m)-7},4 ${x(m)+7},4 ${x(m)},24"/></svg>`};
const WALL=s=>{const c=s.split('|').map(x=>`<span class="wc">${p(x)}</span>`);return `<div class="wall"><div>${c[0]}</div><div>${c[1]}${c[2]}</div><div>${c[3]}${c[4]}${c[5]}</div></div>`};
const TRI=s=>{const c=s.split('|').map((x,i)=>`<span class="wc ${i<3?'inn':''}">${p(x)}</span>`);return `<div class="tr"><i></i>${c[0]}<i></i>${c[3]}<i></i>${c[4]}${c[1]}${c[5]}${c[2]}</div>`};
const F=s=>s.replace(/\[\[(pie|bar|rect):(\d+):(\d+)(?::(\d+))?\]\]/g,(m,k,a,b,c)=>k=='rect'?RECT(+a,+b,+c):k=='pie'&&+a>+b?MULTI(+a,+b):PIC(k,+a,+b)).replace(/\[\[nl:(\d+):(\d+):(\d+):(\d+)\]\]/g,(m,a,b,c,d)=>NL(+a,+b,+c,+d)).replace(/\[\[wall:([^\]]+)\]\]/g,(m,x)=>WALL(x)).replace(/\[\[tri:([^\]]+)\]\]/g,(m,x)=>TRI(x)).replace(/\{(\d+) (\??\d+)\|(\??\d+)\}/g,(m,w,a,b)=>`<span class="mx">${w}</span><span class="fr"><span>${p(a)}</span><span>${p(b)}</span></span>`).replace(/\[\?(\d+)\]/g,(m,i)=>`<input class="in" data-i="${i}" inputmode="numeric" autocomplete="off">`).replace(/\{(\??\d+)\|(\??\d+)\}/g,(m,a,b)=>`<span class="fr"><span>${p(a)}</span><span>${p(b)}</span></span>`);
const B=n=>Math.min(n,1295).toString(36).toUpperCase().padStart(2,'0');
const ck=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i)*(i+1))%1296;return B(h)};
let S={best:Array(24).fill(0),w:0,l:0,k:0,rp:0,streak:0,tries:0,sel:null,done:false,pc:0};
const tot=()=>S.best.reduce((a,b)=>a+b,0);
const ok=(w,l)=>S.best[w*3+l]>=GOAL;
const wu=w=>w<6||(ok(4,1)&&ok(5,1));
const lu=(w,l)=>wu(w)&&(l==0||ok(w,l-1));
const rank=n=>n>=1100?'🏆 Bruch-Meister':n>=700?'🛡️ Ritter':n>=270?'⚔️ Kämpfer':'🌱 Rekrut';
function topbar(r){return `<div class="top"><span>⭐ <b>${tot()}</b>${r?' · Runde <b>'+S.rp+'</b>':''}</span><span>🔥 ${S.streak}</span><span>${rank(tot())}</span></div>`}
function home(){
 $.innerHTML=topbar()+`<h1>🎮 Bruch-Helden</h1><p class="c mu">Erreiche ${GOAL} Punkte in einer Stufe, um die nächste freizuschalten.</p>`+
 W.map((w,wi)=>`<div class="card"><h2>${w.i} Welt ${wi+1}: ${w.n}</h2>`+(wu(wi)?`<p class="mu">${w.intro}</p>`:`<p class="mu">🔒 Schaffe zuerst in <b>Erweitern</b> und <b>Kürzen</b> die Stufe 2 (je ${GOAL} Punkte).</p>`)+
 w.l.map((L,li)=>{const un=lu(wi,li);return `<button class="w" ${un?'':'disabled'} onclick="start(${wi},${li})"><span class="i">${un?(ok(wi,li)?'✅':L.i):'🔒'}</span><span>Stufe ${li+1}: ${L.n}<small>${L.d}${un?' · Beste: '+S.best[wi*3+li]+' · Ziel: '+GOAL:''}</small></span></button>`}).join('')+`</div>`).join('')+
 `<div class="card c"><p class="mu">Fertig für heute? Hol dir deinen Code!</p><button onclick="showCode()">💾 Mein Code</button> <button class="sec" onclick="askCode()">🔑 Code eingeben</button></div>`}
function start(w,l){S.w=w;S.l=l;S.k=0;S.rp=0;S.pc=0;S.streak=0;task()}
function task(){
 const w=W[S.w],L=w.l[S.l],n=L.t.length,t=L.t[S.k];S.tries=0;S.sel=null;S.done=false;
 let body=`<div class="q">${F(t.q)}</div>`;
 if(t.t=='mc')body+=(t.o.some(o=>o.includes('[['))?'<div class="grid">':'')+t.o.map((o,j)=>`<button class="o" id="o${j}" onclick="pick(${j})">${F(o)}</button>`).join('')+(t.o.some(o=>o.includes('[['))?'</div>':'');
 if(t.t=='tf')body+=['✅ Wahr','❌ Falsch'].map((o,j)=>`<button class="o" id="o${j}" onclick="pick(${j})">${o}</button>`).join('');
 if(t.t=='pt')body+=`<div class="pg" style="grid-template-columns:repeat(${t.c},1fr);max-width:${t.c*44}px">`+'<button class="pc" onclick="tg(this)"></button>'.repeat(t.c*t.r)+'</div>';
 $.innerHTML=topbar(1)+`<div class="card"><div class="mu">${w.i} ${w.n} · Stufe ${S.l+1} · Aufgabe ${S.k+1} von ${n}</div><div class="bar"><i style="width:${S.k*100/n}%"></i></div>${body}<div id="fb"></div><div id="act"><button onclick="chk()">Prüfen</button></div></div><button class="sec" onclick="home()">← Weltkarte</button>`;
 const f=document.querySelector('.in');if(f)f.focus();
 document.querySelectorAll('.in').forEach(e=>e.addEventListener('keydown',ev=>{if(ev.key=='Enter')chk()}));}
function tg(el){if(!S.done)el.classList.toggle('on')}
function pick(j){if(S.done)return;S.sel=j;document.querySelectorAll('.o').forEach((e,i)=>e.classList.toggle('s',i==j))}
function chk(){
 if(S.done)return;
 const t=W[S.w].l[S.l].t[S.k];let ok,empty=false;
 if(t.t=='in'){const v=[...document.querySelectorAll('.in')].sort((x,y)=>x.dataset.i-y.dataset.i).map(e=>e.value.trim());empty=v.some(x=>!x);ok=v.every((x,i)=>x===t.a[i])}
 else if(t.t=='pt'){const n=document.querySelectorAll('.pc.on').length;empty=n==0;ok=n===t.a}
 else{empty=S.sel===null;ok=S.sel===t.a}
 const fb=document.getElementById('fb');
 if(empty){fb.innerHTML='<div class="fb no">Bitte zuerst eine Antwort geben.</div>';return}
 if(ok){
  const g=S.tries==0?10:S.tries==1?5:2;S.streak++;let b=S.streak>=3?5:0;S.rp+=g+b;S.pc++;S.done=true;
  fb.innerHTML=`<div class="fb ok pop">🎉 Richtig! +${g}${b?' +'+b+' Bonus 🔥':''} Punkte<br><span class="mu">${F(t.x)}</span></div>`;fin_btn()
 }else{
  S.streak=0;S.tries++;
  if(S.tries<3){fb.innerHTML=`<div class="fb no">${S.tries==1?'Fast!':'Noch nicht ganz.'} 💡 Tipp: ${F(t.h)}<br>${S.tries==1?'Du hast noch 2 Versuche.':'Letzter Versuch!'}</div>`;document.querySelectorAll('.in').forEach(e=>e.value='');S.sel=null;document.querySelectorAll('.o').forEach(e=>e.classList.remove('s'));document.querySelectorAll('.pc').forEach(e=>e.classList.remove('on'))}
  else{S.done=true;fb.innerHTML=`<div class="fb no">Leider falsch.<br>Lösung: ${F(t.x)}</div>`;fin_btn()}
 }
 document.querySelector('.top').outerHTML=topbar(1);}
function fin_btn(){document.querySelectorAll('.in,.o,.pc').forEach(e=>e.disabled=true);
 const last=S.k==W[S.w].l[S.l].t.length-1;document.getElementById('act').innerHTML=`<button onclick="${last?'wend()':'S.k++;task()'}">${last?'Stufe abschließen 🏁':'Weiter ➜'}</button>`}
function wend(){
 const w=W[S.w],L=w.l[S.l],n=L.t.length,i=S.w*3+S.l;
 const u0=wu(6),l0=S.l<2?lu(S.w,S.l+1):true;
 const rec=S.rp>S.best[i];if(rec)S.best[i]=S.rp;
 const u1=wu(6),l1=S.l<2?lu(S.w,S.l+1):true,hit=S.rp>=GOAL;
 let m=hit?'🎯 Ziel erreicht!':`Ziel: ${GOAL} Punkte. Versuche es nochmal!`;
 if(!u0&&u1)m+='<br>🔓 <b>Addieren und Subtrahieren sind freigeschaltet!</b>';
 else if(!l0&&l1)m+=`<br>🔓 <b>Stufe ${S.l+2} ist freigeschaltet!</b>`;
 else if(hit&&S.l==2)m+='<br>👑 Meister-Stufe geschafft!';
 $.innerHTML=topbar()+`<div class="card c pop"><div class="big">${'⭐'.repeat(Math.max(1,Math.round(S.pc*5/n)))}</div><h2>${w.n} · Stufe ${S.l+1}: ${L.n}</h2><p>${S.pc} von ${n} richtig<br><b>${S.rp} Punkte</b>${rec?' · neue Bestleistung!':''}</p><p>${m}</p><button onclick="home()">Zur Weltkarte</button> <button class="sec" onclick="start(${S.w},${S.l})">🔁 Nochmal</button><br><button class="sec" onclick="showCode()">💾 Code anzeigen</button></div>`}
function mkCode(){const b='BH'+S.best.map(B).join('');return 'BH-'+(b+ck(b)).slice(2).match(/.{1,4}/g).join('-')}
function showCode(){$.innerHTML=topbar()+`<div class="card c pop"><h2>💾 Dein Code</h2><p class="mu">Schreibe den Code ab oder mache einen Screenshot. Beim nächsten Mal gibst du ihn ein und machst genau hier weiter.</p><div class="code" id="cd">${mkCode()}</div><button onclick="cp()">📋 Kopieren</button><div id="cm" class="mu"></div></div><button class="sec" onclick="home()">← Weltkarte</button>`}
function cp(){const m=x=>document.getElementById('cm').textContent=x;try{navigator.clipboard.writeText(document.getElementById('cd').textContent).then(()=>m('Kopiert!'),()=>m('Bitte den Code abschreiben.'))}catch(e){m('Bitte den Code abschreiben.')}}
function askCode(){$.innerHTML=topbar()+`<div class="card c"><h2>🔑 Code eingeben</h2><input id="ci" class="in" style="width:100%;font-size:1.1rem" autocapitalize="characters" autocomplete="off" placeholder="BH-XXXX-XXXX-…"><div id="cm" class="fb no" style="display:none">Der Code stimmt nicht. Prüfe jedes Zeichen.</div><button onclick="loadCode()">Laden</button></div><button class="sec" onclick="home()">← Weltkarte</button>`}
function loadCode(){const c=document.getElementById('ci').value.toUpperCase().replace(/[^A-Z0-9]/g,'');let v=null;
 const rd=n=>[...Array(n)].map((_,i)=>parseInt(c.slice(2+i*2,4+i*2),36)),z=n=>Array(n).fill(0),h=n=>ck(c.slice(0,n))==c.slice(n);
 if(c.slice(0,2)=='BH'){
  if(c.length==52&&h(50))v=rd(24);
  else if(c.length==58&&h(56)){const o=rd(27);v=[...o.slice(0,3),...o.slice(6)]}
  else if(c.length==34&&h(32)){const o=rd(15);v=[...o.slice(0,3),...z(9),...o.slice(3)]}
  else if(c.length==28&&h(26))v=[...z(12),...rd(12)]}
 if(v&&!v.some(isNaN)){S.best=v;home()}else document.getElementById('cm').style.display='block'}
home();
</script></body></html>
